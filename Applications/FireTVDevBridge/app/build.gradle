plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.manifold.firetvbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.manifold.firetvbridge'
        minSdk 28
        targetSdk 28
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    signingConfigs {
        lab {
            storeFile file('../signing/lab.keystore')
            storePassword 'firetvlab'
            keyAlias 'lab'
            keyPassword 'firetvlab'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lab
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
